name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "serein-fork-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/ViceVerse-cz/Serein.git 2>/dev/null || true
          git fetch upstream main
          git merge --no-edit upstream/main
          git push
