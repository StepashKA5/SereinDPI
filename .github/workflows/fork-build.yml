name: Fork build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Monotonic version: the built-in updater compares it as semver, so every
      # release must be newer than the previous one.
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stamp version
        shell: pwsh
        run: |
          $path = 'apps/desktop/Cargo.toml'
          $text = Get-Content $path -Raw
          $text = $text -replace '(?m)^version\.workspace = true$', "version = `"$env:VERSION`""
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        run: cargo xtask package

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "dist/serein-zapret-portable.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: serein-zapret-${{ env.VERSION }}
          path: |
            dist-installer/*.exe
            dist/serein-zapret-portable.zip
          if-no-files-found: error

      # Runs triggered by GITHUB_TOKEN do not start another workflow, so this
      # cannot loop back into the build.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SereinDPI ${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist-installer/*.exe
            dist/serein-zapret-portable.zip
